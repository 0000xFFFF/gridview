name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake clang libclang-dev \
            libunwind-dev libglib2.0-dev libgtk-3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev libpostproc-dev \
            libxkbcommon-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev libxrandr-dev \
            libxi-dev libxinerama-dev libxext-dev libxfixes-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev libudev-dev

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DIR="gridview-linux-x86_64"

          mkdir -p "$DIR/share/applications"
          mkdir -p "$DIR/share/icons/hicolor/256x256/apps"

          cp target/release/gridview "$DIR/"
          cp packaging/gridview.desktop "$DIR/share/applications/"
          cp assets/icon.png "$DIR/share/icons/hicolor/256x256/apps/gridview.png"
          cp README.md LICENSE "$DIR/"

          tar -czf "${DIR}-${VERSION}.tar.gz" "$DIR"

      - uses: actions/upload-artifact@v6
        with:
          name: linux-release
          path: "*.tar.gz"

  windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      # Rust comes from MSYS2 too, so the host toolchain is already
      # x86_64-pc-windows-gnu (UCRT64). No cross-compiling, so pkg-config
      # and the *-sys build scripts all see the same environment.
      - name: Install MSYS2 toolchain and libraries
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-ugly
            mingw-w64-ucrt-x86_64-gst-libav

      - name: Verify toolchain and native libraries
        shell: msys2 {0}
        run: |
          cargo --version
          rustc -vV | grep host
          pkg-config --modversion glib-2.0 gstreamer-1.0 gstreamer-app-1.0 \
            gstreamer-video-1.0 libavcodec libavformat

      - name: Build
        shell: msys2 {0}
        run: |
          export LIBCLANG_PATH=/ucrt64/bin

          # clang's x86 AMX intrinsic headers leak into the ffmpeg bindings and
          # produce Rust that can't compile. Pre-define each AMX header's include
          # guard so clang skips them. Guards are read from the installed headers,
          # so this works whatever clang version MSYS2 ships.
          GUARDS=""
          for f in /ucrt64/lib/clang/*/include/amx*.h; do
            g=$(grep -m1 -oE '^#ifndef +__AMX[A-Z0-9_]*' "$f" | awk '{print $2}')
            [ -n "$g" ] && GUARDS="$GUARDS -D$g"
          done
          echo "AMX guards:$GUARDS"

          export BINDGEN_EXTRA_CLANG_ARGS="--target=x86_64-w64-windows-gnu $GUARDS"
          cargo build --release --locked

      # Ship the exe together with every MSYS2 DLL it links against,
      # otherwise it only runs on machines that have MSYS2 installed.
      - name: Collect exe and DLLs
        shell: msys2 {0}
        run: |
          mkdir -p release
          cp target/release/gridview.exe release/
          cp README.md LICENSE release/
          ldd release/gridview.exe | awk '/\/ucrt64\//{print $3}' | xargs -I{} cp {} release/
          ls release

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path release/* -DestinationPath gridview-windows-x64.zip

      - uses: actions/upload-artifact@v6
        with:
          name: windows-release
          path: gridview-windows-x64.zip

  release:
    name: Publish GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-files
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
          generate_release_notes: true
