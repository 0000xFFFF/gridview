
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          build-essential \
          pkg-config \
          cmake \
          clang \
          libclang-dev \
          libunwind-dev \
          libglib2.0-dev \
          libgtk-3-dev \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          libgstreamer-plugins-bad1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          gstreamer1.0-plugins-bad \
          gstreamer1.0-libav \
          libavcodec-dev \
          libavformat-dev \
          libavutil-dev \
          libavfilter-dev \
          libavdevice-dev \
          libswscale-dev \
          libswresample-dev \
          libpostproc-dev \
          libxkbcommon-dev \
          libwayland-dev \
          libx11-dev \
          libx11-xcb-dev \
          libxcb1-dev \
          libxcb-render0-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxcursor-dev \
          libxrandr-dev \
          libxi-dev \
          libxinerama-dev \
          libxext-dev \
          libxfixes-dev \
          libgl1-mesa-dev \
          libegl1-mesa-dev \
          libgles2-mesa-dev \
          libfontconfig1-dev \
          libfreetype-dev \
          libasound2-dev \
          libudev-dev

          echo "Checking FFmpeg..."
          pkg-config --modversion libavcodec libavformat libavutil \
          libavfilter libavdevice libswscale libswresample

          echo "Checking GStreamer..."
          pkg-config --modversion glib-2.0 gstreamer-1.0 \
          gstreamer-app-1.0 gstreamer-video-1.0

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DIR="gridview-linux-x86_64"

          mkdir -p "$DIR/share/applications"
          mkdir -p "$DIR/share/icons/hicolor/256x256/apps"

          cp target/release/gridview "$DIR/"
          cp packaging/gridview.desktop "$DIR/share/applications/"
          cp assets/icon.png "$DIR/share/icons/hicolor/256x256/apps/gridview.png"
          cp README.md LICENSE "$DIR/"

          tar -czf "${DIR}-${VERSION}.tar.gz" "$DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: "*.tar.gz"

  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MSYS2 dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-ugly
            mingw-w64-ucrt-x86_64-gst-libav

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Add Cargo to PATH
        shell: pwsh
        run: |
          echo "$env:USERPROFILE\.cargo\bin" >> $env:GITHUB_PATH

      - name: Verify toolchain
        shell: msys2 {0}
        run: |
          export PATH="$USERPROFILE/.cargo/bin:$PATH"

          cargo --version
          rustc --version
          gcc --version

      - name: Verify native libraries
        shell: msys2 {0}
        run: |
          pkg-config --modversion glib-2.0
          pkg-config --modversion gstreamer-1.0
          pkg-config --modversion gstreamer-app-1.0
          pkg-config --modversion gstreamer-video-1.0
          pkg-config --modversion libavcodec
          pkg-config --modversion libavformat

      - name: Build GridView
        shell: msys2 {0}
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: |
          export PATH="$USERPROFILE/.cargo/bin:$PATH"

          cargo build --release --target x86_64-pc-windows-gnu

      - name: Package Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null

          Copy-Item target/x86_64-pc-windows-gnu/release/gridview.exe release/

          Compress-Archive `
            -Path release/* `
            -DestinationPath gridview-windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: gridview-windows-x64
          path: gridview-windows-x64.zip


  release:
    name: Publish GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
