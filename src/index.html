<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; media-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self';">
        <title>GridView</title>
        <link rel="icon" type="image/x-icon" href="favicon.ico">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div id="topbar">
            <button id="btn_reload" class="icon-button" title="Reload current directory" aria-label="Reload current directory">&#xf0453;</button>
            <button id="btn_muteall" class="icon-button" title="Mute all videos" aria-label="Mute all videos">&#xeb24;</button>

            <label class="checkboxContainer" title="Enable Zoom on Hover (P)">
                <input id="setting_cb_hoverZoom" type="checkbox">
                <span class="checkmark"></span>
            </label>

            <div class="sliderCont">
                <input title="Columns (LEFT, RIGHT)" id="setting_slider_cols" type="range" min="1" max="20" step="1" class="slider">
                <p id="setting_slider_cols_label" class="sliderLabel">...</p>
            </div>

        </div>

        <div id="media-dirs"></div>

        <script src="globals.js"></script>
        <script src="topbar.js"></script>
        <script src="dragndrop.js"></script>
        <script src="render.js"></script>
    </body>
</html>
