[package]
name = "gridview"
version = "3.7.0"
edition = "2021"
description = "Fast masonry image/video gallery (Rust rewrite)"

[dependencies]
eframe = "0.27"
image = { version = "0.24", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff"] }
jpeg-decoder = "0.3"
imagesize = "0.13"
kamadak-exif = "0.5"
walkdir = "2"
rayon = "1"
chrono = "0.4"
directories = "5"
serde = { version = "1", features = ["derive"] }
bincode = "1"
rfd = "0.15"
ffmpeg-next = { version = "9.1", optional = true }
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }
clap = { version = "4.6.7", features = ["derive"] }

[features]
default = ["video-thumbnails", "video-player"]
# In-process libav* video thumbnails (needs ffmpeg dev libs). Build with
# `--no-default-features` to get a build without video thumbnails (ffmpeg) or video player (gstreamer).
video-thumbnails = ["dep:ffmpeg-next"]
video-player = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 2
